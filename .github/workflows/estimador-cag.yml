name: estimador-cag

on:
  pull_request:
    paths: ["estimador-cag/**", ".github/workflows/estimador-cag.yml"]
  push:
    branches: ["ejercicio/**"]
    paths: ["estimador-cag/**", ".github/workflows/estimador-cag.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests (structure + health)
        run: uv run pytest -v
      - name: Docker image builds
        run: docker build -t estimador-cag .
