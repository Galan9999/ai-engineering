[project]
name = "estimador-cag"
version = "0.1.0"
description = "Estimador de software con arquitectura CAG (máster AI Engineering)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "openai>=3.57.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
